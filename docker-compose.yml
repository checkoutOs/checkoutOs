# docker-compose.yml
# Runs the full checkoutOs stack locally:
#   - checkoutos   → the API server (port 3000)
#   - redis        → Redis 7 (port 6379)
#   - mock-gateway → Razorpay mock server (port 9090)
#
# Usage:
#   docker compose up              # start all services
#   docker compose up -d           # start in background
#   docker compose down            # stop and remove containers
#   docker compose logs -f         # follow logs
#   docker compose logs checkoutos # logs for one service
#   docker compose --profile metrics up -d --build
#                                  # + Prometheus, Grafana on :3001 (ADR 003)
#   docker compose --profile observability up -d --build
#                                  # + Loki and Alloy as well
#
# Prerequisites:
#   cp .env.example .env
#   Fill in RAZORPAY_* credentials or leave as-is for mock server usage

# Observability stack (profiles: metrics, observability). Every service in it is
# profile-gated, so it adds nothing to a plain `docker compose up`.
include:
  - observability/docker-compose.observability.yml

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: checkoutos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Persist Redis data across container restarts
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - checkoutos-network

  # ── Mock Gateway Server ────────────────────────────────────────────────────
  # Runs the MSW-based mock Razorpay server.
  # Only needed in development — not included in production deployments.
  # Remove this service and set RAZORPAY_BASE_URL to the real Razorpay URL
  # for production use.
  mock-gateway:
    build:
      context: .
      dockerfile: Dockerfile.mock
    container_name: checkoutos-mock-gateway
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      MOCK_PORT: 9090
    networks:
      - checkoutos-network
    profiles:
      # Only starts when explicitly requested:
      #   docker compose --profile mock up
      # This prevents the mock server from starting in CI or production
      - mock

  # ── checkoutOs API ─────────────────────────────────────────────────────────
  checkoutos:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    container_name: checkoutos-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      # 9464 (/metrics) is deliberately NOT published — scrape it over the
      # compose network as checkoutos:9464 (ADR 003 §3.5).
    env_file:
      # Loads all variables from .env
      # Copy .env.example to .env and fill in your values
      - .env
    environment:
      # Override REDIS_URL to use the Redis service by container name
      # This takes precedence over any value in .env
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    # Bounded stdout logs. Alloy reads this json-file log through the Docker
    # API; rotation can drop lines under very high volume, so size it
    # deliberately rather than relying on the unbounded default (ADR 003 §10.1).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - checkoutos-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  checkoutos-network:
    driver: bridge