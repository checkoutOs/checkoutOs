# observability/grafana/provisioning/datasources/loki.yml
apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      # Log line → its trace in Tempo. trace_id is structured metadata (see
      # observability/alloy/config.alloy). Before the tracing profile the link
      # leads nowhere — only error traces and ~10% of the rest are exported.
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
