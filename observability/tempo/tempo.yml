# observability/tempo/tempo.yml
# Single-binary Tempo on the local filesystem — for local/evaluation use
# (compose `tracing` profile). Receives OTLP from checkoutOs on the compose
# network; nothing is published to the host.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

# Single binary, one ingester: pin the ring to this process. Without an
# explicit address Tempo picks one per network interface — this container is
# on two networks — and /ready stays 503 ("waiting for 15s after being ready").
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    # 7 days, like Prometheus and Loki (ADR 003 §10.1).
    block_retention: 168h

usage_report:
  reporting_enabled: false
